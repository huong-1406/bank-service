services:
  postgres:
    image: postgres:16-alpine
    container_name: bank-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: bank_service
    ports:
      - "5432:5432"
    volumes:
      - bank-service-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d bank_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bank-service-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bank-service-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: bank-service-activemq
    restart: unless-stopped
    environment:
      ACTIVEMQ_ADMIN_LOGIN: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_ADMIN_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - bank-service-activemq-data:/opt/apache-activemq/data

volumes:
  bank-service-postgres-data:
  bank-service-redis-data:
  bank-service-activemq-data:
