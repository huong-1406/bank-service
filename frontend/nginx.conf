server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React chỉ có 1 file index.html. Vào thẳng /cards rồi F5 thì nginx không có file "cards"
    # → trả index.html để React tự hiện đúng trang, thay vì lỗi 404
    location / {
        try_files $uri /index.html;
    }
}
